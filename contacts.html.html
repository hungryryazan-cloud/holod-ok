<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - ХОЛОД-ОК</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #f9f9f9;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2d72bb;
            color: white;
            padding: 40px 30px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
            color: white;
        }
        
        .subtitle {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: white;
        }
        
        .availability {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }
        
        .contacts-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .contact-card {
            display: flex;
            align-items: center;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(45, 114, 187, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .contact-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 25px rgba(45, 114, 187, 0.2);
            border-color: #2d72bb;
        }
        
        .contact-card:hover::before {
            left: 100%;
        }
        
        .contact-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 24px;
            color: white;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .contact-card:hover .contact-icon {
            transform: scale(1.1) rotate(5deg);
        }
        
        .phone-icon {
            background: #2d72bb;
        }
        
        .whatsapp-icon {
            background: #25D366;
        }
        
        .telegram-icon {
            background: #0088cc;
        }
        
        .contact-info {
            flex-grow: 1;
        }
        
        .contact-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            transition: color 0.3s ease;
        }
        
        .contact-card:hover .contact-title {
            color: #2d72bb;
        }
        
        .phone-number {
            font-size: 18px;
            color: #555;
            font-weight: 500;
        }
        
        .action-button {
            background: #fccc00;
            color: #333;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(252, 204, 0, 0.3);
        }
        
        .contact-card:hover .action-button {
            background: #2d72bb;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(45, 114, 187, 0.3);
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 600px) {
            .header {
                padding: 30px 20px 25px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .contacts-container {
                padding: 20px;
            }
            
            .contact-card {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            
            .contact-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .action-button {
                margin-top: 10px;
                min-width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>СВЯЖИТЕСЬ С НАМИ</h1>
            <p class="subtitle">Удобным для вас способом</p>
            <p class="availability">Мы доступны с 6:30 до 21:30 по московскому времени</p>
        </div>
        
        <div class="contacts-container">
            <a href="tel:+79106176757" class="contact-card">
                <div class="contact-icon phone-icon">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">ПОЗВОНИТЕ НАМ</div>
                    <div class="phone-number">+7 (910) 617-67-57</div>
                </div>
                <div class="action-button">Позвонить</div>
            </a>
            
            <a href="https://wa.me/79106176757" target="_blank" class="contact-card">
                <div class="contact-icon whatsapp-icon">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">WHATSAPP</div>
                </div>
                <div class="action-button">Написать</div>
            </a>
            
            <a href="https://t.me/holodok_remont" target="_blank" class="contact-card">
                <div class="contact-icon telegram-icon">
                    <i class="fab fa-telegram-plane"></i>
                </div>
                <div class="contact-info">
                    <div class="contact-title">TELEGRAM</div>
                </div>
                <div class="action-button">Написать</div>
            </a>
        </div>
        
        <div class="footer">
            <p>"ХОЛОД-ОК" © 2025 Все права защищены.</p>
        </div>
    </div>

    <script>
        // Добавляем анимацию при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const contactCards = document.querySelectorAll('.contact-card');
            
            contactCards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 200 * index);
            });
        });
    </script>
</body>
</html>
